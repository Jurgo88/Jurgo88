<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 166" width="480" height="166" role="img" aria-label="JAPS">
  <style>
    .bg{fill:#f6f8fa;stroke:#d0d7de} .ttl{fill:#1f2328} .link{fill:#0969da} .txt{fill:#59636e}
    .pill{fill:#e6ebf1} .tag{fill:#3d4650} .dot{fill:#8b5cf6}
    text{font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif} .ttl{font-size:19px;font-weight:600} .txt{font-size:15px} .tag{font-size:12px;font-weight:500}
    @media (prefers-color-scheme: dark){
      .bg{fill:#151b23;stroke:#3d444d} .ttl{fill:#f0f6fc} .link{fill:#4493f8} .txt{fill:#9198a1}
      .pill{fill:#262c36} .tag{fill:#c9d1d9}
    }
  </style>
  <rect x="0.5" y="0.5" width="479" height="165" rx="12" class="bg"/>
  <text x="24" y="42" class="ttl link">JAPS</text>
    <text x="24" y="82" class="txt">Just Another Portfolio Site: builds a portfolio</text>
  <text x="24" y="106" class="txt">from your Netlify sites and GitHub repos.</text>
  <rect x="24" y="124" width="54" height="24" rx="12" class="pill"/><text x="51.0" y="140" text-anchor="middle" class="tag">Astro</text>
  <rect x="86" y="124" width="89" height="24" rx="12" class="pill"/><text x="130.5" y="140" text-anchor="middle" class="tag">Cloudflare</text>
  <rect x="183" y="124" width="68" height="24" rx="12" class="pill"/><text x="217.0" y="140" text-anchor="middle" class="tag">Netlify</text>
</svg>
